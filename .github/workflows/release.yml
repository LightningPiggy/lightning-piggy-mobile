name: Release

on:
  # Fire when a GitHub Release is published (UI: Releases → Draft a new release).
  # The Release creates the tag server-side; no separate tag-push trigger needed.
  release:
    types: [published]
  # Allow manual re-run without re-tagging (e.g. to retry a failed EAS build).
  workflow_dispatch:
    inputs:
      platform:
        description: Platform(s) to release
        type: choice
        # iOS auto-submits to TestFlight (ASC API key on EAS). Android
        # builds per-ABI APKs that the `attach-android-apk` job downloads and
        # attaches to the GitHub Release — no auto-submit to Play until
        # a Google Play account + service-account JSON are wired up via
        # `eas credentials` (see docs/DEPLOYMENT.adoc).
        default: all
        options: [ios, android, all]
      whats_new_build:
        description: >-
          Only set TestFlight "What to Test" for this existing iOS build number
          (skips all builds) — e.g. after a submission was retried by hand.
        type: string
        default: ''

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # needed to upload assets to the Release

env:
  EAS_CLI_VERSION: '18.6.0'

jobs:
  release-notes:
    name: Generate release notes
    # Also locks out manual Nostr retries while either job updates a body.
    concurrency:
      group: release-body-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      text: ${{ steps.notes.outputs.text }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate notes from merged PR titles
        id: notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${RELEASE_REF}^" 2>/dev/null || true)
          scripts/release-notes-from-prs.sh "$previous" "$RELEASE_REF" > "$RUNNER_TEMP/release-notes.md"
          delimiter="NOTES_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "text<<$delimiter"
            cat "$RUNNER_TEMP/release-notes.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - name: Append generated notes to GitHub Release
        if: github.event_name == 'release'
        run: |
          # The Release page alone (not TestFlight or the changelog) also says
          # which of the per-ABI APKs attach-android-apk uploads to download.
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-body.md"
          cat >> "$RUNNER_TEMP/release-body.md" <<EOF

          ### Android download

          - **Most phones:** \`lightning-piggy-${RELEASE_REF}-arm64-v8a.apk\`
          - **Older 32-bit phones** (if that one won't install): \`lightning-piggy-${RELEASE_REF}-armeabi-v7a.apk\`

          The APKs appear under Assets once the Android build finishes.
          EOF
          node scripts/update-release-body.mjs --tag "$RELEASE_REF" \
            --section generated-notes --content-file "$RUNNER_TEMP/release-body.md"
      - name: Append generated section to changelog archive
        if: github.event_name == 'release'
        env:
          PREVIOUS_TAG: ${{ steps.notes.outputs.previous }}
        run: |
          archive=docs/CHANGELOG.md
          [ -f "$archive" ] || archive=CHANGELOG.md
          if [ -f "$archive" ]; then
            # Carry forward prior generated sections without writing to protected main.
            # A Git tag need not have a GitHub Release or an archive attachment.
            if [ -n "$PREVIOUS_TAG" ] &&
              gh release view "$PREVIOUS_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/previous-assets.txt"; then
              if grep -Fxq CHANGELOG.md "$RUNNER_TEMP/previous-assets.txt"; then
                gh release download "$PREVIOUS_TAG" --pattern CHANGELOG.md --dir "$RUNNER_TEMP/previous"
                cp "$RUNNER_TEMP/previous/CHANGELOG.md" "$archive"
              fi
            fi
            if ! grep -Fxq "## $RELEASE_REF" "$archive"; then
              printf '\n## %s\n\n' "$RELEASE_REF" >> "$archive"
              cat "$RUNNER_TEMP/release-notes.md" >> "$archive"
            fi
            cp "$archive" "$RUNNER_TEMP/CHANGELOG.md"
            gh release upload "$RELEASE_REF" "$RUNNER_TEMP/CHANGELOG.md" --clobber
          fi

  # Gates + platform resolution, shared by both build jobs. The two EAS
  # builds below then run in PARALLEL on separate runners (the EAS Starter
  # plan allows 2 concurrent iOS + 5 Android builds). They used to run one
  # after the other in a single job, so Android waited ~13 min for iOS.
  prepare:
    name: Quality gates & resolve platform
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.platform.outputs.value }}
    steps:
      - name: Verify EXPO_TOKEN is set
        # Fail fast here, before either build job starts.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Missing EXPO_TOKEN::Set EXPO_TOKEN under Settings → Secrets and variables → Actions. Generate at https://expo.dev/accounts/bengweeks/settings/access-tokens."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node, install dependencies, set version from tag
        uses: ./.github/actions/release-setup

      - name: Quality gates
        run: |
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Resolve platform
        id: platform
        env:
          WHATS_NEW_BUILD: ${{ github.event.inputs.whats_new_build }}
          PLATFORM_INPUT: ${{ github.event.inputs.platform || 'all' }}
        run: |
          # On Release events the input is empty, so default to building
          # both platforms. iOS is auto-submitted to TestFlight; Android
          # is built only (no Google Play submit until creds wired), then
          # the attach-android-apk job downloads the per-ABI APKs and
          # attaches them to the Release page for sideloading.
          # A "What to Test"-only re-run builds nothing.
          if [ -n "$WHATS_NEW_BUILD" ]; then
            echo "value=none" >> "$GITHUB_OUTPUT"
          else
            echo "value=$PLATFORM_INPUT" >> "$GITHUB_OUTPUT"
          fi

  build-ios:
    name: EAS build & submit — iOS
    # Own job, so a failed iOS build or TestFlight submission (e.g. an Apple
    # agreement awaiting acceptance — v1.4.0) can't skip or delay Android.
    # The job still fails, which fails the run, so the problem stays visible.
    needs: prepare
    if: contains(fromJSON('["ios","all"]'), needs.prepare.outputs.platform)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node, install dependencies, set version from tag
        uses: ./.github/actions/release-setup

      - name: EAS build — iOS (auto-submit to TestFlight)
        id: ios
        run: |
          npx -p eas-cli@${{ env.EAS_CLI_VERSION }} eas build \
            --profile production \
            --platform ios \
            --non-interactive \
            --auto-submit

      - name: Explain the iOS build or submission failure
        if: failure() && steps.ios.outcome == 'failure'
        run: |
          echo "::error title=iOS build or TestFlight submission failed::Android builds in its own job and is unaffected. If the build finished but submission failed, resubmit with 'eas submit --platform ios --id <build-id>'; if the build failed, re-run this workflow with platform=ios. Then re-run with whats_new_build set."
          exit 1

  build-android:
    name: EAS build — Android
    needs: prepare
    if: contains(fromJSON('["android","all"]'), needs.prepare.outputs.platform)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node, install dependencies, set version from tag
        uses: ./.github/actions/release-setup

      - name: EAS build — Android (APKs only, attached to Release)
        # Deliberately no --auto-submit: Google Play credentials aren't
        # wired yet (pending Play Developer account + service-account
        # JSON). The production profile builds one APK per ABI
        # (arm64-v8a, armeabi-v7a; plugins/withAndroidAbiSplits.js), which
        # the `attach-android-apk` job below downloads and attaches.
        # Add `--auto-submit` here once `eas submit --platform android`
        # is configured in eas.json.
        run: |
          npx -p eas-cli@${{ env.EAS_CLI_VERSION }} eas build \
            --profile production \
            --platform android \
            --non-interactive

  set-testflight-whats-new:
    name: Set TestFlight "What to Test"
    # iOS-only: the App Store Connect betaBuildLocalizations endpoint has no
    # Android equivalent (Play Console "What's New" is a separate flow that
    # eas submit handles natively once Android auto-submit is wired up).
    # Runs after a successful iOS build, or on a "What to Test"-only re-run
    # (whats_new_build set), where prepare resolves platform=none and
    # build-ios is skipped. A skipped need would skip this job by default,
    # hence the explicit !cancelled() + result checks.
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.release-notes.result == 'success' &&
      (needs.build-ios.result == 'success' || github.event.inputs.whats_new_build != '')
    needs: [prepare, build-ios, release-notes]
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NODE_NO_WARNINGS: '1'
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `eas build:list` (below) resolves the EAS project by EVALUATING
      # app.config.ts, whose `extra.eas.projectId` is the only place the id
      # lives. app.config.ts `import`s `expo/config` + ./package.json, so it
      # can't load without node_modules — without this step every build:list
      # call dies with a bare `Error: build:list command failed.` (the build
      # job works only because it runs npm ci; this job and Attach didn't).
      - name: Install dependencies
        run: npm ci

      - name: Verify ASC API key is wired
        env:
          # The ASC API key is stored under the EXPO_ASC_* secret names (the
          # same key EAS uses for `eas submit`). Map them onto the ASC_* env
          # vars the script reads. The earlier ASC_* secret names never
          # existed, so this job silently soft-skipped and left "What to Test"
          # blank on every release until v1.2.1.
          ASC_API_KEY_ID: ${{ secrets.EXPO_ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.EXPO_ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          # The same .p8 EAS uses for `eas submit` is needed here. This is a
          # one-time GH Secrets setup; see docs/DEPLOYMENT.adoc → "TestFlight
          # 'What to Test' automation". If absent, soft-skip rather than fail
          # the release — Ben can fill in "What to Test" manually for this build.
          if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_KEY_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::warning title=ASC API key not configured::Skipping auto-populate of TestFlight 'What to Test'. Set EXPO_ASC_API_KEY_ID, EXPO_ASC_API_KEY_ISSUER_ID, EXPO_ASC_API_KEY_P8 repo secrets to enable. See docs/DEPLOYMENT.adoc."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        id: gate

      - name: Resolve iOS build version from EAS
        if: steps.gate.outputs.skip != 'true'
        id: iosbuild
        env:
          WHATS_NEW_BUILD: ${{ github.event.inputs.whats_new_build }}
        run: |
          # A "What to Test"-only re-run names the build directly.
          if [ -n "$WHATS_NEW_BUILD" ]; then
            if ! [[ "$WHATS_NEW_BUILD" =~ ^[0-9]+$ ]]; then
              echo "::error::whats_new_build must be an iOS build number, e.g. 45"
              exit 1
            fi
            echo "version=$WHATS_NEW_BUILD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pick the iOS build EAS just produced for this commit. The build
          # number (CFBundleVersion — the integer in parens TestFlight shows
          # next to the X.Y.Z marketing version) is `appBuildVersion` in
          # eas-cli >= 18 JSON output; `.buildVersion` is kept as a fallback
          # for older CLIs. Reading the wrong field made this step report
          # "no build found" on every release even when the build existed.
          # --build-profile production: a PREVIEW build of the same commit
          # (e.g. an ad-hoc device build cut right after the release) can be
          # newer in the list and has its own build-number counter — the
          # v1.3.3 rerun polled ASC for preview build "1" forever because
          # of exactly that.
          version=$(npx -y -p eas-cli@${{ env.EAS_CLI_VERSION }} eas build:list \
            --platform ios --status finished --build-profile production \
            --limit 5 --json --non-interactive \
            | jq -r --arg sha "${{ github.sha }}" \
                '[.[] | select(.gitCommitHash == $sha)][0] | (.appBuildVersion // .buildVersion) // empty')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::warning title=No iOS build resolved::Could not find a finished iOS build for commit ${{ github.sha }}. Skipping whatsNew."
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Resolved iOS build version: $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare TestFlight notes
        if: steps.gate.outputs.skip != 'true' && steps.iosbuild.outputs.version != ''
        id: changelog
        env:
          RELEASE_NOTES: ${{ needs.release-notes.outputs.text }}
        run: |
          # Apple caps What to Test at 4000 characters. Preserve whole lines.
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { randomUUID } from 'node:crypto';
          const text = process.env.RELEASE_NOTES;
          let notes = text;
          if (notes.length > 3900) {
            notes = notes.slice(0, 3850);
            notes = notes.slice(0, notes.lastIndexOf('\n')) + '\n- ...and more';
          }
          const delimiter = `NOTES_${randomUUID()}`;
          console.log(`whatsnew<<${delimiter}\n${notes}\n${delimiter}`);
          JS

      - name: PATCH whatsNew via App Store Connect API
        if: steps.gate.outputs.skip != 'true' && steps.iosbuild.outputs.version != ''
        env:
          ASC_API_KEY_ID: ${{ secrets.EXPO_ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.EXPO_ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          ASC_APP_ID: '6762218164' # matches eas.json → submit.production.ios.ascAppId
          ASC_BUILD_VERSION: ${{ steps.iosbuild.outputs.version }}
          WHATS_NEW: ${{ steps.changelog.outputs.whatsnew }}
        run: node scripts/asc-set-whats-new.mjs

  attach-android-apk:
    name: Attach Android APKs to Release
    # Only runs on an actual Release event (workflow_dispatch has no release to attach to)
    # AND only when the Android build succeeded. Depends on build-android
    # alone, so the APKs attach as soon as Android finishes and an iOS
    # failure can't skip them.
    if: github.event_name == 'release'
    needs: build-android
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        # eas build:list resolves the project via app.config.ts / eas.json from the repo root.
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      # Required so `eas build:list` can evaluate app.config.ts (which holds
      # the only copy of extra.eas.projectId and imports expo/config). Missing
      # this is what made every poll attempt below fail with `Error: build:list
      # command failed.` on v1.3.0 — the retries masked a hard config-load
      # error as a transient hiccup, burning the full poll then erroring.
      - name: Install dependencies
        run: npm ci

      - name: Resolve latest finished Android APK URL
        id: find
        env:
          # Suppress Node deprecation warnings on stdout. NODE_NO_WARNINGS
          # only handles Node-level deprecations though — eas-cli itself
          # can also print error / progress noise to stdout (`Error:
          # build:list command failed.` on transient API hiccups,
          # update-notifier banners), which is what v1.0.2-rc1 tripped on.
          # The script below captures stderr separately, retries once on
          # failure, and strips any pre-JSON prefix before jq sees it.
          NODE_NO_WARNINGS: '1'
        run: |
          set -uo pipefail

          # Pick the FINISHED Android production build for THIS commit, filtering
          # by gitCommitHash so we never grab an unrelated older build.
          #
          # This job runs right after build-android, and there's a brief
          # window where the just-finished build hasn't yet surfaced as
          # "finished" in `eas build:list` (eventual consistency). A single-shot
          # query raced here on v1.2.0 and produced a spurious "No Android build
          # artifact" failure (#674). So POLL: treat both a failed call and an
          # empty/lagging result as "retry", and only error out once the poll
          # is exhausted.

          fetch() {
            local out_file="$1" err_file="$2"
            npx -y -p eas-cli@${{ env.EAS_CLI_VERSION }} eas build:list \
              --platform android --status finished --build-profile production \
              --limit 5 --json \
              --non-interactive \
              > "$out_file" 2> "$err_file"
          }

          OUT=$(mktemp)
          ERR=$(mktemp)
          CLEAN=$(mktemp)
          JQERR=$(mktemp)
          url=""
          attempts=12
          for i in $(seq 1 "$attempts"); do
            if ! fetch "$OUT" "$ERR"; then
              echo "::warning title=eas build:list call failed (attempt $i/$attempts)::Transient EAS API hiccup; retrying in 20 s."
              [ "$i" -lt "$attempts" ] && sleep 20
              continue
            fi

            # Strip any non-JSON prefix lines (deprecation banners / progress
            # noise written to stdout) — keep from the first `[` line onward.
            sed -n '/^\[/,$p' "$OUT" > "$CLEAN"

            # Fail fast on a genuine jq parse error (malformed JSON / an EAS
            # CLI output-format change) instead of mistaking it for an
            # eventual-consistency empty result — otherwise a real format
            # break burns the whole poll window then fails with a misleading
            # "not surfaced yet" message.
            if ! url=$(jq -r --arg sha "${{ github.sha }}" \
                         '[.[] | select(.gitCommitHash == $sha)][0].artifacts.buildUrl // empty' \
                         "$CLEAN" 2>"$JQERR"); then
              echo "::error title=jq failed to parse eas build:list output::Likely an EAS CLI / JSON format change — logs below."
              echo "::group::jq stderr"; cat "$JQERR"; echo "::endgroup::"
              echo "::group::raw stdout"; cat "$OUT"; echo "::endgroup::"
              echo "::group::cleaned JSON"; cat "$CLEAN"; echo "::endgroup::"
              exit 1
            fi
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              echo "Resolved Android APK URL on attempt $i/$attempts."
              break
            fi

            echo "::warning title=Finished Android build not surfaced yet (attempt $i/$attempts)::eas build:list has no finished build for ${{ github.sha }} yet; retrying in 20 s."
            [ "$i" -lt "$attempts" ] && sleep 20
          done

          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error title=No Android build artifact for commit ${{ github.sha }} after $attempts attempts::EAS build may have failed, or build:list never surfaced it. Recent builds + last stderr dumped below."
            echo "::group::recent builds (cleaned)"
            cat "$CLEAN"
            echo "::endgroup::"
            echo "::group::last eas build:list stderr"
            cat "$ERR"
            echo "::endgroup::"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download and unpack the per-ABI APKs
        env:
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ steps.find.outputs.url }}
        run: |
          # The production profile builds one APK per ABI
          # (plugins/withAndroidAbiSplits.js). EAS uploads more than one
          # application archive as a single .tar.gz of the matched files.
          work="$RUNNER_TEMP/eas-artifact"
          mkdir -p "$work" dist
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "$URL" -o "$work/artifact"
          # A bare APK here means the ABI splits didn't apply; an HTML page
          # means a failed download. Either way, don't attach anything.
          file "$work/artifact" | grep -qi 'gzip' || {
            echo "::error title=Android artifact is not a .tar.gz::Expected EAS to pack the arm64-v8a and armeabi-v7a APKs into one archive."
            file "$work/artifact"
            exit 1
          }
          tar -xzf "$work/artifact" -C "$work"
          for abi in arm64-v8a armeabi-v7a; do
            src=$(find "$work" -type f -name "app-$abi-release.apk")
            if [ "$(printf '%s\n' "$src" | grep -c .)" -ne 1 ]; then
              echo "::error title=Missing $abi APK::Expected exactly one app-$abi-release.apk in the EAS artifact."
              find "$work" -type f
              exit 1
            fi
            mv "$src" "dist/lightning-piggy-$TAG-$abi.apk"
          done
          ls -la dist/

      - name: Install Android alignment tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: sdkmanager 'build-tools;35.0.0'

      - name: Verify the APKs
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          # 16 KB page-size alignment of the 64-bit libraries. The script only
          # audits 64-bit ABIs, so the armeabi-v7a APK has nothing for it.
          bash scripts/check-elf-alignment.sh "dist/lightning-piggy-$TAG-arm64-v8a.apk"
          version_codes=""
          for abi in arm64-v8a armeabi-v7a; do
            apk="dist/lightning-piggy-$TAG-$abi.apk"
            "$BUILD_TOOLS/zipalign" -c -P 16 4 "$apk"
            # Exactly one ABI per APK.
            abis=$({ unzip -Z1 "$apk" 'lib/*' 2>/dev/null || true; } | cut -d/ -f2 | sort -u | paste -sd, -)
            if [ "$abis" != "$abi" ]; then
              echo "::error title=Wrong native libraries in $abi APK::Found ABIs: ${abis:-none}"
              exit 1
            fi
            # Native libraries stored compressed (useLegacyPackaging in app.config.ts).
            stored=$({ unzip -v "$apk" 'lib/*' 2>/dev/null || true; } | awk '$2 == "Stored" { n++ } END { print n + 0 }')
            if [ "$stored" -ne 0 ]; then
              echo "::error title=Uncompressed native libraries in $abi APK::$stored lib/ entries are Stored, expected Deflated."
              exit 1
            fi
            code=$("$BUILD_TOOLS/aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            echo "$abi: versionCode $code, $(du -h "$apk" | cut -f1)"
            version_codes="$version_codes $code"
          done
          # Both APKs must carry the same versionCode (no per-ABI offset), so
          # either one upgrades an existing install in place.
          if [ "$(echo $version_codes | tr ' ' '\n' | sort -u | grep -c .)" -ne 1 ]; then
            echo "::error title=versionCode differs between APKs::$version_codes"
            exit 1
          fi

      - name: Upload APKs to Release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "dist/lightning-piggy-$TAG-arm64-v8a.apk" \
            "dist/lightning-piggy-$TAG-armeabi-v7a.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber

  sync-release-identifiers:
    name: Sync EAS build numbers into Release title
    # A TestFlight tester sees `1.0.1 (42)` (X.Y.Z + EAS build number); the
    # GH Release shows `v1.0.1-rc1`. Without correlation it's hard to tell
    # which release a given TestFlight build came from. This step rewrites
    # the Release title to embed the iOS + Android build numbers, so a
    # tester can match `(42)` in TestFlight against the title here.
    if: github.event_name == 'release'
    needs: [build-ios, build-android, attach-android-apk]
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      NODE_NO_WARNINGS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      # `eas build:list` resolves the EAS project by evaluating app.config.ts,
      # which can't load without node_modules — same failure class as #791.
      # This job was missed by #792 (it only fixed whats-new + attach) and
      # broke the v1.3.2 title sync.
      - name: Install dependencies
        run: npm ci

      - name: Resolve build numbers + edit Release title
        run: |
          # Pull the build number for this commit on each platform. Filter
          # by gitCommitHash so we don't accidentally pick up an unrelated
          # in-flight build from a parallel branch.
          ios_build=$(npx -y -p eas-cli@${{ env.EAS_CLI_VERSION }} eas build:list \
            --platform ios --status finished --build-profile production \
            --limit 5 --json --non-interactive \
            | jq -r --arg sha "${{ github.sha }}" \
                '[.[] | select(.gitCommitHash == $sha)][0] | (.appBuildVersion // .buildVersion) // empty')
          android_build=$(npx -y -p eas-cli@${{ env.EAS_CLI_VERSION }} eas build:list \
            --platform android --status finished --build-profile production \
            --limit 5 --json --non-interactive \
            | jq -r --arg sha "${{ github.sha }}" \
                '[.[] | select(.gitCommitHash == $sha)][0] | (.appBuildVersion // .buildVersion) // empty')

          # Derive the original title from the release event payload.
          # Fall back to the tag name if no title was set.
          base_title=$(gh release view "${{ github.event.release.tag_name }}" \
            --repo "$GITHUB_REPOSITORY" --json name --jq .name)
          if [ -z "$base_title" ] || [ "$base_title" = "${{ github.event.release.tag_name }}" ]; then
            base_title="${{ github.event.release.tag_name }}"
          fi

          # Compose the suffix from whichever build numbers we resolved.
          # Both should be present on a normal "all platforms" release;
          # platform-specific re-runs may legitimately have only one.
          suffix=""
          if [ -n "$ios_build" ] && [ -n "$android_build" ]; then
            suffix=" (iOS build $ios_build / Android build $android_build)"
          elif [ -n "$ios_build" ]; then
            suffix=" (iOS build $ios_build)"
          elif [ -n "$android_build" ]; then
            suffix=" (Android build $android_build)"
          fi

          if [ -z "$suffix" ]; then
            echo "::warning title=No build numbers resolved::Could not find a finished EAS build for commit ${{ github.sha }} on either platform; leaving Release title unchanged."
            exit 0
          fi

          # Idempotency: if the title already contains the build-number
          # suffix (e.g. workflow re-run), don't double-append.
          if echo "$base_title" | grep -qE '\(iOS build [0-9]+|Android build [0-9]+)'; then
            echo "Release title already has a build-number suffix; skipping rewrite."
            exit 0
          fi

          new_title="${base_title}${suffix}"
          echo "Old title: $base_title"
          echo "New title: $new_title"
          gh release edit "${{ github.event.release.tag_name }}" \
            --repo "$GITHUB_REPOSITORY" --title "$new_title"

  attach-technical-pdf:
    name: Generate & attach Technical Solution PDF
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Node (for the mermaid CLI)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install asciidoctor-pdf + asciidoctor-diagram + rouge + mermaid CLI
        run: |
          gem install asciidoctor-pdf asciidoctor-diagram rouge
          # mmdc renders DATA_STORAGE.adoc's [mermaid] blocks; generate-docs.sh
          # points its headless Chrome at docs/puppeteer-mermaid.json
          # (--no-sandbox) so it launches on the CI runner. Without this the
          # PDF job failed every release ("mmdc is not installed"). Pinned (like
          # EAS_CLI_VERSION) for reproducible release docs — 11.9.0 is the
          # version v1.3.1's PDF was generated with.
          npm install -g @mermaid-js/mermaid-cli@11.9.0

      - name: Generate PDF
        run: bash docs/generate-docs.sh

      - name: Upload PDF to Release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            docs/TECHNICAL_SOLUTION_DOCUMENT.pdf \
            --repo "$GITHUB_REPOSITORY" --clobber

  summary:
    name: Summary
    if: always()
    needs:
      [
        prepare,
        build-ios,
        build-android,
        attach-android-apk,
        attach-technical-pdf,
        set-testflight-whats-new,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## Release ${{ github.event.release.tag_name || github.ref_name }}"
            echo ""
            echo "- EAS builds: https://expo.dev/accounts/bengweeks/projects/lightning-piggy-app/builds"
            echo "- Submissions: https://expo.dev/accounts/bengweeks/projects/lightning-piggy-app/submissions"
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "- Release assets: ${{ github.event.release.html_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
