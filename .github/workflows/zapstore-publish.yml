name: Zapstore publish

on:
  # Runs after the release note so the two never use the shared Amber client key at once.
  workflow_run:
    workflows: [Release Nostr note]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zapstore-publish
  cancel-in-progress: false

env:
  ZSP_VERSION: 2.0.1
  ZSP_SHA256: 1ef5373f8ecd9ba63d2c3fab98abb0d31b2244a2aac31b3749fb205c7d5f5b38

jobs:
  publish:
    # The note workflow runs on every Release completion; only follow it when it ran for a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: secrets
        env:
          NOSTR_RELEASE_BUNKER_URI: ${{ secrets.NOSTR_RELEASE_BUNKER_URI }}
          NOSTR_RELEASE_CLIENT_KEY: ${{ secrets.NOSTR_RELEASE_CLIENT_KEY }}
        run: |
          if [ -z "$NOSTR_RELEASE_BUNKER_URI" ] || [ -z "$NOSTR_RELEASE_CLIENT_KEY" ]; then
            echo '::notice::Zapstore publish skipped: configure both NOSTR_RELEASE secrets.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      # zapstore.yaml and the listing images come from trusted main, never from a release tag.
      - name: Checkout main
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install zsp
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zsp" "https://github.com/zapstore/zsp/releases/download/v${ZSP_VERSION}/zsp-${ZSP_VERSION}-linux-amd64"
          echo "${ZSP_SHA256}  $RUNNER_TEMP/zsp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/zsp"

      # Reuse the release-note client key so Amber recognises the existing connection.
      - name: Reuse the Amber client key
        if: steps.secrets.outputs.enabled == 'true'
        env:
          NOSTR_RELEASE_BUNKER_URI: ${{ secrets.NOSTR_RELEASE_BUNKER_URI }}
          NOSTR_RELEASE_CLIENT_KEY: ${{ secrets.NOSTR_RELEASE_CLIENT_KEY }}
        run: |
          signer=$(printf '%s' "$NOSTR_RELEASE_BUNKER_URI" | sed -E 's#^bunker://([0-9a-f]{64}).*#\1#')
          if ! printf '%s' "$signer" | grep -qE '^[0-9a-f]{64}$'; then
            echo '::error::NOSTR_RELEASE_BUNKER_URI does not start with bunker://<hex pubkey>.'
            exit 1
          fi
          if ! printf '%s' "$NOSTR_RELEASE_CLIENT_KEY" | grep -qE '^[0-9a-f]{64}$'; then
            echo '::error::NOSTR_RELEASE_CLIENT_KEY must be a 64-character hex secret key.'
            exit 1
          fi
          dir="$HOME/.config/zsp/bunker-keys"
          mkdir -p "$dir" && chmod 700 "$dir"
          umask 077
          printf '%s\n' "$NOSTR_RELEASE_CLIENT_KEY" > "$dir/$signer.key"

      - name: Publish to Zapstore (approve in Amber)
        if: steps.secrets.outputs.enabled == 'true'
        env:
          SIGN_WITH: ${{ secrets.NOSTR_RELEASE_BUNKER_URI }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          "$RUNNER_TEMP/zsp" publish -q --json > "$RUNNER_TEMP/zsp.json"
          code=$?
          set -e
          jq '{status, version_name, version_code, id: (.release_event_id // .event_id // null), error: (.error | if . then {code, detail} else null end)}' "$RUNNER_TEMP/zsp.json" || cat "$RUNNER_TEMP/zsp.json"
          if jq -e '.error.code == "release_already_published"' "$RUNNER_TEMP/zsp.json" >/dev/null; then
            echo '::notice::This release is already on Zapstore.'
            exit 0
          fi
          exit $code
