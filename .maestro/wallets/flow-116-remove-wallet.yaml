appId: ${APP_ID || 'com.lightningpiggy.app.dev'}
name: Remove Wallet Test
---
# Removes the currently active wallet via the settings cog.
# Swipe to the wallet you want to remove before running this test.
# Run: maestro test .maestro/wallets/flow-116-remove-wallet.yaml

# Wait for app to be ready
- waitForAnimationToEnd:
    timeout: 25000

# Wait for a wallet to be visible
- extendedWaitUntil:
    visible:
      text: 'Connected'
    timeout: 20000

# Tap the settings cog on the wallet card
- tapOn:
    id: 'wallet-settings'
- waitForAnimationToEnd:
    timeout: 3000

# Remove Wallet sits in the settings sheet's fixed footer, so no scrolling
- extendedWaitUntil:
    visible:
      id: 'wallet-settings-remove'
    timeout: 5000

# Tap Remove Wallet
- tapOn:
    id: 'wallet-settings-remove'
- waitForAnimationToEnd:
    timeout: 2000

# Confirm the removal dialog ("Remove", or "Remove Anyway" for a wallet
# holding a recovery phrase / CoinOS login — same testID either way)
- tapOn:
    id: 'remove-wallet-confirm'
- waitForAnimationToEnd:
    timeout: 3000
